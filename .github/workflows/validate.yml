name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ansible-galaxy collection install -r requirements.yml
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform/object-storage init -backend=false -input=false
      - run: terraform -chdir=terraform/object-storage validate
      - run: uv run --frozen ansible-lint playbook.yaml operations.yml tasks/*.yml
      - run: uv run --frozen ansible-playbook -i inventory.ini playbook.yaml --syntax-check
      - run: uv run --frozen python -m unittest discover -s tests -v
